<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Shows</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navigation">
  <div class="nav-container">
    <div class="nav-logo">🎬 MovieRec</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/movies.html">Movies</a></li>
      <li><a href="/tvshows.html">TV Shows</a></li>
      <li><a href="/channels.html">Channels</a></li>
      <li><a href="/reviews.html">Reviews</a></li>
      <li id="profile-link" style="display:none;"><a href="/profile.html">Profile</a></li>
      <li id="admin-link" style="display:none;"><a href="/admin.html">Admin Panel</a></li>
      <li id="login-link"><a href="/login.html">Login</a></li>
      <li id="register-link"><a href="/register.html">Register</a></li>
      <li id="logout-link" style="display:none;">
        <a href="#" onclick="logout()">Logout</a>
      </li>
    </ul>
  </div>
</nav>

  <header class="header">
    <h1>📺 TV Shows</h1>
    <input id="search" type="text" placeholder="Search TV Shows..." />
  </header>

  <h2>Latest TV Shows</h2>
  <div id="latest-tvshows" class="container"></div>

  <h2>Popular TV Shows</h2>
  <div id="popular-tvshows" class="container"></div>

<div id="admin-create-section" class="form-container">
  <h2>Create New TV Show</h2>
  <form id="createTvShowForm" class="form">
    <div class="form-group">
      <label for="newTitle">Title</label>
      <input type="text" id="newTitle" placeholder="Show title" required>
    </div>
    <div class="form-group">
      <label for="newGenre">Genre</label>
      <input type="text" id="newGenre" placeholder="Drama, Comedy, etc." required>
    </div>
    <div class="form-group">
      <label for="newSeasons">Number of Seasons</label>
      <input type="number" id="newSeasons" placeholder="5" min="1">
    </div>
    <div class="form-group">
      <label for="newYear">Start Year</label>
      <input type="number" id="newYear" placeholder="2019" min="1900" max="2030">
    </div>
    <div class="form-group">
      <label for="newRating">Rating (0-10)</label>
      <input type="number" step="0.1" id="newRating" placeholder="8.2">
    </div>
    <div class="form-group">
      <label for="newPoster">Poster URL</label>
      <input type="text" id="newPoster" placeholder="https://image.tmdb.org/...">
    </div>
    <div class="form-group">
      <label for="newDescription">Description</label>
      <textarea id="newDescription" placeholder="Show summary..."></textarea>
    </div>
    <button type="submit" class="form-submit-btn">Create TV Show</button>
  </form>
  <div id="tvMessage" class="form-message"></div>
</div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <img id="modalPoster" src="" alt="Poster" />
      <h2 id="modalTitle"></h2>
      <p id="modalGenre"></p>
      <p id="modalSeasons"></p>
      <p id="modalYear"></p>
      <p id="modalRating"></p>
      <p id="modalDescription"></p>
      <button id="favoriteBtn">Add to Favorites</button>
      <button id="watchedBtn">Mark as Watched</button>
      <button id="updateBtn">Update TV Show</button>
      <button id="deleteBtn">Delete TV Show</button>

    </div>
  </div>
  <script src="/js/tvshows.js"></script>
  <script src="/js/common.js"></script>
</body>
</html>
