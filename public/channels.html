<!-- public/channels.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Channels</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navigation">
  <div class="nav-container">
    <div class="nav-logo">🎬 MovieRec</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/movies.html">Movies</a></li>
      <li><a href="/tvshows.html">TV Shows</a></li>
      <li><a href="/channels.html">Channels</a></li>
      <li><a href="/reviews.html">Reviews</a></li>
      <li id="profile-link" style="display:none;"><a href="/profile.html">Profile</a></li>
      <li id="admin-link" style="display:none;"><a href="/admin.html">Admin Panel</a></li>
      <li id="login-link"><a href="/login.html">Login</a></li>
      <li id="register-link"><a href="/register.html">Register</a></li>
      <li id="logout-link" style="display:none;">
        <a href="#" onclick="logout()">Logout</a>
      </li>
    </ul>
  </div>
</nav>
  <header class="header">
    <h1>📡 TV Channels</h1>
    <input id="search" type="text" placeholder="Search Channels..." />
  </header>
  <h2>Latest Channels</h2>
  <div id="latest-channels" class="container"></div>
  <h2>Popular Channels</h2>
  <div id="popular-channels" class="container"></div>

  
  <div id="admin-create-section" class="form-container">
  <h2>Create New Channel</h2>
  <form id="createChannelForm" class="form">
    <div class="form-group">
      <label for="newName">Channel Name</label>
      <input type="text" id="newName" placeholder="Channel name" required>
    </div>
    <div class="form-group">
      <label for="newCountry">Country</label>
      <input type="text" id="newCountry" placeholder="USA, Japan, etc.">
    </div>
    <div class="form-group">
      <label for="newCategory">Category</label>
      <input type="text" id="newCategory" placeholder="News, Sports, Movies" required>
    </div>
    <div class="form-group">
      <label for="newLogo">Logo URL</label>
      <input type="text" id="newLogo" placeholder="https://...">
    </div>
    <div class="form-group">
      <label for="newDescription">Description</label>
      <textarea id="newDescription" placeholder="Channel description..."></textarea>
    </div>
    <button type="submit" class="form-submit-btn">Create Channel</button>
  </form>
  <div id="channelMessage" class="form-message"></div>
</div>
  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <img id="modalLogo" src="" alt="Logo" />
      <h2 id="modalName"></h2>
      <p id="modalCountry"></p>
      <p id="modalCategory"></p>
      <p id="modalDescription"></p>
      <button id="favoriteBtn">Add to Favorites</button>
      <button id="watchedBtn">Mark as Watched</button>
      <button id="updateBtn">Update Channel</button>
      <button id="deleteBtn">Delete Channel</button>
    </div>
  </div>
  <script src="/js/channels.js"></script>
  <script src="/js/common.js"></script>
</body>
</html>
