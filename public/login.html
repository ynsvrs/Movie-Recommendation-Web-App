<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MovieRec</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navigation">
    <div class="nav-container">
      <div class="nav-logo">🎬 MovieRec</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/movies.html">Movies</a></li>
        <li><a href="/tvshows.html">TV Shows</a></li>
        <li><a href="/channels.html">Channels</a></li>
        <li id="profile-link" style="display:none;"><a href="/profile.html">Profile</a></li>
        <li id="admin-link" style="display:none;"><a href="/admin.html">Admin Panel</a></li>
        <li id="login-link"><a href="/login.html">Login</a></li>
        <li id="register-link"><a href="/register.html">Register</a></li>
        <li id="logout-link" style="display:none;">
          <a href="#" onclick="logout()">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

    <div class="form-container">
        <h2>Login</h2>
        <p class="subtitle">Welcome back! Log in to continue.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="login">Username or Email</label>
            <input type="text" id="login" placeholder="Enter username or email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="form-submit-btn">Login</button>
        </form>

        <p class="switch-auth">
          Don't have an account? <a href="/register.html">Register here</a>
        </p>

        <p id="loginMsg" class="auth-message"></p>
    </div>

  <footer style="text-align:center; padding:20px; color:#666;">
    <p>&copy; 2024 MovieRec Project — Group SE-2423</p>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
