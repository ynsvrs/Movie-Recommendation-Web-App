<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MovieRec</title>

  <!-- Main project styles -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Google Font (same as project) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navigation">
  <div class="nav-container">
    <div class="nav-logo">🎬 MovieRec</div>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/movies.html">Movies</a></li>
      <li><a href="/tvshows.html">TV Shows</a></li>
      <li><a href="/channels.html">Channels</a></li>
      <li><a href="/tickets.html">Tickets</a></li>
      <li><a href="/favorites.html">Favorites</a></li>
      <li><a href="/login.html" class="active">Login</a></li>
    </ul>
  </div>
</nav>

<!-- ================= HEADER ================= -->
<header class="header">
  <h1>Account Access</h1>
  <p style="color:#aaa;">Login or create an account to manage content</p>
</header>

<!-- ================= AUTH SECTION ================= -->
<main class="container" style="grid-template-columns: 1fr; max-width: 900px;">

  <div class="auth-grid">

    <!-- LOGIN -->
    <section class="auth-card">
      <h2>Login</h2>

      <form id="loginForm" class="auth-form">
        <input
          type="text"
          name="username"
          placeholder="Username"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>

      <p id="loginMsg" style="margin-top:10px;"></p>
    </section>

    <!-- REGISTER -->
    <section class="auth-card">
      <h2>Register</h2>

      <form id="registerForm" class="auth-form">
        <input
          type="text"
          name="username"
          placeholder="Username"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Create Account</button>
      </form>

      <p id="registerMsg" style="margin-top:10px;"></p>
    </section>

  </div>

</main>

<!-- ================= FOOTER ================= -->
<footer style="text-align:center; padding:20px; color:#666;">
  <p>&copy; 2024 MovieRec Project — Group SE-2423</p>
</footer>

<!-- ================= JS ================= -->
<script>
/* ---------- LOGIN ---------- */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = e.target.username.value;
  const password = e.target.password.value;
  const msg = document.getElementById("loginMsg");

  msg.textContent = "Processing...";
  msg.style.color = "#aaa";

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      msg.textContent = "✔ Login successful";
      msg.style.color = "#28a745";

      setTimeout(() => {
        window.location.href = "/";
      }, 800);
    } else {
      msg.textContent = data.error || "Invalid credentials";
      msg.style.color = "#dc3545";
    }
  } catch (err) {
    msg.textContent = "Server error";
    msg.style.color = "#dc3545";
  }
});

/* ---------- REGISTER ---------- */
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = e.target.username.value;
  const password = e.target.password.value;
  const msg = document.getElementById("registerMsg");

  msg.textContent = "Processing...";
  msg.style.color = "#aaa";

  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      msg.textContent = "✔ Registration successful. You are logged in.";
      msg.style.color = "#28a745";

      setTimeout(() => {
        window.location.href = "/";
      }, 1000);
    } else {
      msg.textContent = data.error || "Registration failed";
      msg.style.color = "#dc3545";
    }
  } catch (err) {
    msg.textContent = "Server error";
    msg.style.color = "#dc3545";
  }
});
</script>

</body>
</html>
