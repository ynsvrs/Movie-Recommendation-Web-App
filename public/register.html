 <div class="form-container">
  <h2>Create Account</h2>
  <form id="registerForm" class="form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
    </div>
    <button type="submit" class="form-submit-btn">Register</button>
  </form>
  <div id="error" class="form-message form-error" style="display:none;"></div>
  <div id="success" class="form-message form-success" style="display:none;"></div>
</div>
  </main>
