<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tickets - MovieRec</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .seat {
      width: 30px;
      height: 30px;
      background-color: #333;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .seat.selected {
      background-color: #00d4ff;
      box-shadow: 0 0 10px #00d4ff;
    }
    .seat:hover {
      background-color: #444;
    }
    .screen {
      width: 100%;
      height: 5px;
      background: #00d4ff;
      box-shadow: 0 10px 20px rgba(0,212,255,0.5);
      margin-bottom: 30px;
      border-radius: 5px;
    }
    .summary {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #00d4ff;
    }
  </style>
</head>
<body>

  <nav class="navigation">
    <div class="nav-container">
      <div class="nav-logo">🎬 MovieRec</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/movies.html">Movies</a></li>
        <li><a href="/tvshows.html">TV Shows</a></li>
        <li><a href="/channels.html">Channels</a></li>
        <li><a href="/tickets.html">Tickets</a></li>
        <li><a href="/favorites.html">Favorites</a></li>
      </ul>
    </div>
  </nav>

  <header class="header">
    <h1> Book Your Experience</h1>
    <p>Tickets for Inception</p>
  </header>

  <div class="container" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">
    
    <section class="card" style="padding: 30px;">
      <h3>Select Seats</h3>
      <div class="screen"></div>
      <p style="text-align: center; font-size: 0.8rem; color: #666;">SCREEN</p>
      
      <div class="seat-grid" id="seat-grid">
        </div>
      
      <div style="display: flex; gap: 20px; font-size: 0.8rem; justify-content: center;">
        <span><span style="display:inline-block; width:12px; height:12px; background:#333; border-radius:2px;"></span> Available</span>
        <span><span style="display:inline-block; width:12px; height:12px; background:#00d4ff; border-radius:2px;"></span> Selected</span>
      </div>
    </section>

    <aside class="summary">
      <h3>Order Summary</h3>
      <div style="margin: 20px 0;">
        <p>Movie: <strong id="movie-name">Interactive Premiere</strong></p>
        <p>Tickets: <strong id="ticket-count">0</strong></p>
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        <h2 style="color: #00d4ff;">Total: $<span id="total-price">0</span></h2>
      </div>
      <button id="buy-btn" style="width: 100%;" disabled>Confirm Booking</button>
      <p id="msg" style="color: #28a745; margin-top: 15px; display: none;">✔ Booking successful!</p>
    </aside>

  </div>

  <script>
    const seatGrid = document.getElementById('seat-grid');
    const ticketCount = document.getElementById('ticket-count');
    const totalPrice = document.getElementById('total-price');
    const buyBtn = document.getElementById('buy-btn');
    const msg = document.getElementById('msg');
    
    let selectedSeats = 0;
    const PRICE_PER_TICKET = 12;

    for (let i = 0; i < 40; i++) {
      const seat = document.createElement('div');
      seat.className = 'seat';
      seat.addEventListener('click', () => {
        seat.classList.toggle('selected');
        
        selectedSeats = document.querySelectorAll('.seat.selected').length;
        
    
        ticketCount.textContent = selectedSeats;
        totalPrice.textContent = selectedSeats * PRICE_PER_TICKET;
        
        
        buyBtn.disabled = selectedSeats === 0;
      });
      seatGrid.appendChild(seat);
    }

    buyBtn.addEventListener('click', () => {
      buyBtn.textContent = 'Processing...';
      setTimeout(() => {
        buyBtn.style.display = 'none';
        msg.style.display = 'block';
        document.querySelectorAll('.seat.selected').forEach(s => {
          s.style.opacity = '0.5';
          s.style.pointerEvents = 'none';
        });
      }, 1500);
    });
  </script>

</body>
</html>
